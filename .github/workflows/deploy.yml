# Build wasm (WebGPU) + static SPA and deploy to GitHub Pages.
# Weights stay on Hugging Face Hub — this workflow only ships web/dist
# and fails if any staged file is ≥100MB.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build wasm (WebGPU)
        run: |
          wasm-pack build web --release --target web --out-dir "$PWD/web/pkg" \
            -- --no-default-features --features webgpu

      - name: Stage site
        run: bash web/stage.sh

      - name: Guard against huge committed weights
        run: |
          if find web/dist -type f -size +99M | grep -q .; then
            echo "::error::File ≥100MB in web/dist — host weights on Hugging Face Hub instead."
            find web/dist -type f -size +99M -print
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
