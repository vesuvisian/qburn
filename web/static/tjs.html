<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qburn — transformers.js</title>
    <meta
      name="description"
      content="Describe a scene with Qwen3-VL via transformers.js and ONNX Runtime on WebGPU — the faster baseline next to the Burn demo."
    />
    <link rel="icon" href="./logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="stylesheet" href="./demo.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stage">
      <nav class="site-nav" aria-label="Site">
        <a href="./">Home</a>
        <a href="./demo.html">Burn</a>
        <a href="./tjs.html" aria-current="page">transformers.js</a>
        <a href="./architecture.html">Architecture</a>
        <a href="./compare.html">Compare</a>
        <a
          href="https://github.com/vesuvisian/qburn"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </nav>

      <header class="brand">
        <a class="brand-lockup" href="./">
          <img class="brand-mark" src="./logo.png" alt="" width="56" height="73" />
          <h1>qburn</h1>
        </a>
        <p>
          transformers.js + ONNX Runtime on WebGPU — same caption job as Burn,
          usually faster. See
          <a href="./compare.html">why both demos exist</a>.
        </p>
      </header>

      <section class="panel" aria-label="Upload and describe">
        <div id="gate" class="gate hidden"></div>
        <div id="status" class="status">Checking WebGPU…</div>
        <div id="progress" class="progress hidden" aria-hidden="true">
          <div class="bar"><span id="barFill"></span></div>
          <span id="progressLabel">0%</span>
        </div>

        <label class="drop" id="dropZone" for="fileInput">
          <input
            id="fileInput"
            type="file"
            accept="image/*,video/*"
            multiple
            hidden
          />
          <span>Drop 1 video or up to 4 images, or click to upload</span>
        </label>

        <div class="preview-row">
          <div id="thumbs" class="thumbs" aria-label="Selected media"></div>
          <div class="controls">
            <label class="prompt-label" for="prompt">Prompt</label>
            <input
              id="prompt"
              type="text"
              value="Describe this scene."
              autocomplete="off"
            />
            <label class="prompt-label" for="maxTokens">Max tokens</label>
            <input
              id="maxTokens"
              type="number"
              min="16"
              max="512"
              step="16"
              value="128"
              autocomplete="off"
            />
            <label class="prompt-label" for="temperature">Temperature</label>
            <input
              id="temperature"
              type="number"
              min="0"
              max="1.5"
              step="0.1"
              value="0"
              autocomplete="off"
            />
            <button id="describeBtn" type="button" disabled>Describe</button>
          </div>
        </div>

        <output id="caption" class="caption" aria-live="polite"></output>
      </section>
    </main>
    <script type="module" src="./tjs.js"></script>
  </body>
</html>
