<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qburn — scene description</title>
    <link rel="icon" href="./logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="stylesheet" href="./demo.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stage">
      <nav class="site-nav" aria-label="Site">
        <a href="./" aria-current="page">Demo</a>
        <a href="./engineering.html">Engineering</a>
        <a href="./how-it-works.html">How it works</a>
      </nav>

      <header class="brand">
        <div class="brand-lockup">
          <img class="brand-mark" src="./logo.png" alt="" width="56" height="73" />
          <h1>qburn</h1>
        </div>
        <p>Describe a scene with Qwen3-VL, running locally in your browser on WebGPU.</p>
      </header>

      <section class="panel" aria-label="Upload and describe">
        <div id="gate" class="gate hidden"></div>
        <div id="status" class="status">Checking WebGPU…</div>
        <div id="progress" class="progress hidden" aria-hidden="true">
          <div class="bar"><span id="barFill"></span></div>
          <span id="progressLabel">0%</span>
        </div>

        <label class="drop" id="dropZone" for="fileInput">
          <input id="fileInput" type="file" accept="image/*" hidden />
          <span>Drop an image here, or click to upload</span>
        </label>

        <div class="preview-row">
          <img id="preview" alt="" class="preview hidden" />
          <div class="controls">
            <label class="prompt-label" for="prompt">Prompt</label>
            <input
              id="prompt"
              type="text"
              value="Describe this scene."
              autocomplete="off"
            />
            <label class="prompt-label" for="temperature">Temperature</label>
            <input
              id="temperature"
              type="number"
              min="0"
              max="1.5"
              step="0.1"
              value="0"
              autocomplete="off"
            />
            <button id="describeBtn" type="button" disabled>Describe</button>
          </div>
        </div>

        <output id="caption" class="caption" aria-live="polite"></output>
      </section>
    </main>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
