[workspace]
resolver = "2"
members = [
    "crates/qburn",
    "crates/converter",
    "web",
]
default-members = ["crates/qburn"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vesuvisian/qburn"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
burn = { version = "0.23.0-pre.2", default-features = false, features = ["std", "store"] }
burn-store = { version = "0.23.0-pre.2", default-features = false, features = ["std", "safetensors"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
half = { version = "2", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
js-sys = "0.3"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# cubecl 0.12-pre gates `tune::sampler` off wasm but still imports `measured`
# from it — unblock Burn 0.23 WebGPU wasm (Hardware-aware matmul, no burn-cubecl patch).
[patch.crates-io]
cubecl-runtime = { path = "patches/cubecl-runtime" }
